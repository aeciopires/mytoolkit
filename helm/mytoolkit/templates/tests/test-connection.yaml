apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mytoolkit.fullname" . }}-test-connection"
  labels:
    {{- include "mytoolkit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  containers:
    # `helm test`: the web Service must answer both the liveness and the
    # readiness endpoint (the same ones the Deployment's probes use).
    - name: health
      image: busybox:1.38
      command: ["sh", "-c"]
      args:
        - >-
          wget -q -O- http://{{ include "mytoolkit.fullname" . }}:{{ .Values.service.port }}{{ .Values.livenessProbe.path }} &&
          wget -q -O- http://{{ include "mytoolkit.fullname" . }}:{{ .Values.service.port }}{{ .Values.readinessProbe.path }}
    {{- if .Values.mcp.enabled }}
    - name: mcp-health
      image: busybox:1.38
      command: ["sh", "-c"]
      args:
        - >-
          wget -q -O- http://{{ include "mytoolkit.mcp.fullname" . }}:{{ .Values.mcp.port }}{{ .Values.livenessProbe.path }} &&
          wget -q -O- http://{{ include "mytoolkit.mcp.fullname" . }}:{{ .Values.mcp.port }}{{ .Values.readinessProbe.path }}
    {{- end }}
  restartPolicy: Never
